# Publishes the VS Code extension (editors/vscode-lyth) when a tag vscode-vX.Y.Z is
# pushed: checks the tag against package.json, runs the extension's tests, packages one
# .vsix, publishes it to Open VSX, and attaches it to a GitHub release. Run it by hand
# ("Run workflow") to test and package without publishing; the .vsix is kept as an
# artifact. RELEASING.md lists where the extension is published.
#
# Open VSX accepts the workflow as the trusted publisher of lyth-lang.lyth (no secret;
# an OVSX_PAT secret, if set, is used instead). The VS Code Marketplace takes the .vsix
# from the GitHub release by hand, unless the secret VSCE_PAT is set (see RELEASING.md).
name: Release VS Code extension

on:
  push:
    tags: ["vscode-v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Open VSX trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode-lyth
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-cliff needs the history and tags since the previous release

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode-lyth/package-lock.json

      - name: Check the tag against package.json
        run: |
          version=$(node -p "require('./package.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "vscode-v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi

      - run: npm ci

      - name: Test
        # the integration tests start VS Code, which needs a display
        run: xvfb-run -a npm test

      - name: Package
        run: npx vsce package --out "lyth-$VERSION.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: lyth-vscode-${{ env.VERSION }}
          path: editors/vscode-lyth/lyth-${{ env.VERSION }}.vsix

      # The commits since the previous extension release that touch the extension or its
      # grammar, written by git-cliff with Lyth's cliff.toml and the extension's tags.
      - id: notes
        name: Write the release notes
        if: github.event_name == 'push'
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          args: >-
            --latest --strip header --tag-pattern '^vscode-v'
            --include-path 'editors/vscode-lyth/**' --include-path 'website/src/lyth-grammar.mjs'
        # the action pastes args into a bash command line, so the quotes keep bash from
        # expanding the globs into file names
        env:
          OUTPUT: release-notes.md

      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "lyth-$VERSION.vsix" --title "Lyth for VS Code $VERSION" --notes-file "${{ steps.notes.outputs.changelog }}"

      - name: Publish to Open VSX
        if: github.event_name == 'push'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx@1.2.0 publish "lyth-$VERSION.vsix"
          else
            npx --yes ovsx@1.2.0 publish "lyth-$VERSION.vsix" --trusted-publishing
          fi

      - name: Publish to the VS Code Marketplace
        if: github.event_name == 'push'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx vsce publish --packagePath "lyth-$VERSION.vsix"
          else
            echo "::notice::Upload lyth-$VERSION.vsix from the GitHub release to the VS Code Marketplace by hand: https://marketplace.visualstudio.com/manage/publishers/lyth-lang"
          fi

      - name: Summary
        if: github.event_name == 'push'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Lyth for VS Code $VERSION
          - GitHub release with the .vsix: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME
          - Open VSX: https://open-vsx.org/extension/lyth-lang/lyth
          - VS Code Marketplace: https://marketplace.visualstudio.com/items?itemName=lyth-lang.lyth
            (without VSCE_PAT, upload the .vsix at https://marketplace.visualstudio.com/manage/publishers/lyth-lang)
          EOF
